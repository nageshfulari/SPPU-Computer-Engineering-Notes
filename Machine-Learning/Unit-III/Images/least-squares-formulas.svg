<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="18" fill="white"/><text x="30" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Least Squares – Final Regression Coefficients</text><rect x="35" y="75" width="830" height="115" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="65" y="120" font-family="Arial" font-size="24" fill="#1e3a8a">Slope (b) = [nΣXY − (ΣX)(ΣY)] / [nΣX² − (ΣX)²]</text><text x="65" y="160" font-family="Arial" font-size="19" fill="#334155">Measures the change in predicted Y for one-unit change in X.</text><rect x="35" y="215" width="830" height="95" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="65" y="270" font-family="Arial" font-size="24" fill="#166534">Intercept (a) = [ΣY − bΣX] / n</text><text x="35" y="355" font-family="Arial" font-size="22" font-weight="bold" fill="#0f172a">Final regression equation:  Ŷ = a + bX</text></svg>