<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><rect width="900" height="360" rx="18" fill="#fff"/><text x="30" y="38" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Bias and Variance</text><g transform="translate(35 65)"><rect width="400" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#334155">Variance of X</text><text x="200" y="82" text-anchor="middle" font-family="Arial" font-size="24" fill="#0f172a">Var(X) = E(X²) − [E(X)]²</text><text x="200" y="130" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">For σ = 1.4</text><text x="200" y="165" text-anchor="middle" font-family="Arial" font-size="23" fill="#1d4ed8">Var(X) = σ² = 1.96</text><path d="M50 210 H350" stroke="#94a3b8" stroke-width="2"/><circle cx="200" cy="210" r="7" fill="#2563eb"/></g><g transform="translate(465 65)"><rect width="400" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#334155">Normal Distribution</text><path d="M45 205 H355 M55 205 V65" stroke="#475569" stroke-width="2"/><path d="M55 205 C110 205 120 190 150 115 C175 50 225 50 250 115 C280 190 300 205 355 205" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M200 65 V205" stroke="#64748b" stroke-dasharray="6 5"/><text x="200" y="235" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Mean</text></g></svg>