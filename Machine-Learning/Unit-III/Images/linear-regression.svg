<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" rx="18" fill="white"/><text x="30" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Linear Regression – Best-fit Line</text><path d="M90 350 V75 M90 350 H830" stroke="#334155" stroke-width="3"/><text x="835" y="375" font-family="Arial" font-size="16" fill="#334155">Predictor (X)</text><text x="30" y="78" font-family="Arial" font-size="16" fill="#334155">Response (Y)</text><path d="M110 105 L790 315" stroke="#16a34a" stroke-width="5"/><g fill="#2563eb"><circle cx="150" cy="125" r="8"/><circle cx="210" cy="145" r="8"/><circle cx="270" cy="155" r="8"/><circle cx="330" cy="190" r="8"/><circle cx="390" cy="185" r="8"/><circle cx="450" cy="220" r="8"/><circle cx="510" cy="230" r="8"/><circle cx="570" cy="255" r="8"/><circle cx="630" cy="260" r="8"/><circle cx="690" cy="295" r="8"/><circle cx="750" cy="300" r="8"/></g><text x="500" y="95" font-family="Arial" font-size="21" fill="#166534">Y = a + bX</text><text x="500" y="125" font-family="Arial" font-size="15" fill="#475569">a = intercept, b = slope</text></svg>