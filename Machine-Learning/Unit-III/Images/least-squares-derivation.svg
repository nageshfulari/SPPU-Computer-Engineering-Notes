<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" rx="18" fill="white"/><text x="30" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Least Squares – Derivation</text><g font-family="Arial" fill="#0f172a" font-size="21"><text x="55" y="105">Given observations: (x₁,y₁), (x₂,y₂), …, (xₙ,yₙ)</text><text x="55" y="165">Predicted value: ŷᵢ = a + bxᵢ</text><text x="55" y="225">Residual: eᵢ = yᵢ − (a + bxᵢ)</text><text x="55" y="285">Sum of squared errors:</text><text x="95" y="330" font-size="24">SSE = Σ [yᵢ − (a + bxᵢ)]²</text><text x="55" y="390">Differentiate and equate to zero:</text><text x="95" y="435">Σyᵢ = na + bΣxᵢ</text><text x="95" y="475">Σxᵢyᵢ = aΣxᵢ + bΣxᵢ²</text><text x="55" y="525" font-size="18" fill="#1d4ed8">These are the two normal equations used to find a and b.</text></g></svg>