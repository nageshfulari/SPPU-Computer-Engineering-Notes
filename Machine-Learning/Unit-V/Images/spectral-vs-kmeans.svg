<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><rect width="900" height="450" rx="18" fill="white"/><text x="28" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">K-Means vs Spectral Clustering – Non-linear Groups</text><g transform="translate(40 75)"><text x="180" y="25" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#334155">K-Means</text><circle cx="180" cy="190" r="125" fill="none" stroke="#2563eb" stroke-width="28" stroke-dasharray="550 250" transform="rotate(20 180 190)"/><circle cx="180" cy="190" r="60" fill="none" stroke="#dc2626" stroke-width="28"/><text x="180" y="365" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">May split concentric shapes poorly</text></g><g transform="translate(490 75)"><text x="180" y="25" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#334155">Spectral Clustering</text><circle cx="180" cy="190" r="125" fill="none" stroke="#2563eb" stroke-width="28"/><circle cx="180" cy="190" r="60" fill="none" stroke="#dc2626" stroke-width="28"/><text x="180" y="365" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">Uses similarity graph to separate shapes</text></g></svg>