<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760"><rect width="700" height="760" rx="18" fill="white"/><text x="25" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">K-Medoids – Basic Flow</text><g font-family="Arial" font-size="18" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="225" y="75" width="250" height="55" rx="10"/><rect x="225" y="165" width="250" height="55" rx="10"/><rect x="225" y="255" width="250" height="55" rx="10"/><rect x="225" y="345" width="250" height="55" rx="10"/></g><g fill="#1e3a8a"><text x="350" y="109">Select number of clusters K</text><text x="350" y="199">Choose K initial medoids</text><text x="350" y="289">Assign points to nearest medoid</text><text x="350" y="379">Calculate total clustering cost</text></g><path d="M350 130 V165 M350 220 V255 M350 310 V345 M350 400 V440" stroke="#475569" stroke-width="3"/><path d="M350 440 l-9 -14 h18 z" fill="#475569"/><path d="M350 455 l150 65 -150 65 -150 -65 z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="350" y="515" fill="#92400e">Does swapping a medoid</text><text x="350" y="540" fill="#92400e">reduce total cost?</text><path d="M200 520 H90 V625 H225" fill="none" stroke="#16a34a" stroke-width="3"/><path d="M225 625 l-14 -8 v16 z" fill="#16a34a"/><text x="120" y="500" font-size="16" fill="#166534">Yes</text><rect x="225" y="605" width="250" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="350" y="639" fill="#166534">Update medoids and repeat</text><path d="M500 520 H600 V700 H475" fill="none" stroke="#dc2626" stroke-width="3"/><path d="M475 700 l14 -8 v16 z" fill="#dc2626"/><text x="555" y="500" font-size="16" fill="#991b1b">No</text><rect x="225" y="685" width="250" height="55" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="350" y="719" fill="#334155">Final clusters – Stop</text></g></svg>