<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><rect width="900" height="420" rx="18" fill="white"/><text x="28" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Local Outlier Factor – Local Density</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><circle cx="150" cy="140" r="10"/><circle cx="190" cy="115" r="10"/><circle cx="220" cy="160" r="10"/><circle cx="170" cy="195" r="10"/><circle cx="235" cy="215" r="10"/><circle cx="280" cy="145" r="10"/><circle cx="300" cy="195" r="10"/><circle cx="350" cy="160" r="10"/><circle cx="380" cy="205" r="10"/></g><circle cx="650" cy="145" r="13" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><path d="M650 145 L615 175 M650 145 L690 185 M650 145 L675 100" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><circle cx="250" cy="165" r="95" fill="none" stroke="#2563eb" stroke-dasharray="7 6" stroke-width="2"/><text x="250" y="300" text-anchor="middle" font-family="Arial" font-size="17" fill="#1d4ed8">Dense neighbourhood</text><text x="650" y="225" text-anchor="middle" font-family="Arial" font-size="17" fill="#b91c1c">Potential outlier</text><text x="450" y="365" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">LOF compares a point's local density with the local densities of its neighbours.</text></svg>