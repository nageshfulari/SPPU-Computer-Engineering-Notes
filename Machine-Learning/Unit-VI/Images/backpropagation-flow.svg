<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720"><rect width="760" height="720" rx="18" fill="white"/><text x="28" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Backpropagation Training Flow</text><g font-family="Arial" font-size="18" text-anchor="middle"><g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="240" y="75" width="280" height="50" rx="9"/><rect x="240" y="155" width="280" height="50" rx="9"/><rect x="240" y="235" width="280" height="50" rx="9"/><rect x="240" y="315" width="280" height="50" rx="9"/><rect x="240" y="395" width="280" height="50" rx="9"/><rect x="240" y="475" width="280" height="50" rx="9"/></g><g fill="#1e3a8a"><text x="380" y="107">Initialize weights and biases</text><text x="380" y="187">Forward propagation</text><text x="380" y="267">Calculate prediction error</text><text x="380" y="347">Backward propagation</text><text x="380" y="427">Calculate gradients</text><text x="380" y="507">Update weights and biases</text></g><path d="M380 125 V155 M380 205 V235 M380 285 V315 M380 365 V395 M380 445 V475 M380 525 V555" stroke="#475569" stroke-width="3"/><path d="M380 555 l-9 -14 h18 z" fill="#475569"/><path d="M380 570 l150 55 -150 55 -150 -55 z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="380" y="630" fill="#92400e">Error acceptable?</text><path d="M230 625 H110 V185 H240" fill="none" stroke="#dc2626" stroke-width="3"/><text x="125" y="605" font-size="16" fill="#991b1b">No – repeat</text><path d="M530 625 H650" stroke="#16a34a" stroke-width="3"/><text x="585" y="610" font-size="16" fill="#166534">Yes – stop</text></g></svg>