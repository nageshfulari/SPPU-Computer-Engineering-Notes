<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" rx="18" fill="white"/><text x="28" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">CNN Padding – Valid and Same</text><g font-family="Arial" text-anchor="middle"><text x="235" y="90" font-size="20" fill="#334155">Valid Padding</text><text x="665" y="90" font-size="20" fill="#334155">Same Padding</text><g transform="translate(110 125)" stroke="#2563eb" stroke-width="2"><rect width="250" height="190" fill="#dbeafe"/><path d="M50 0 V190 M100 0 V190 M150 0 V190 M200 0 V190 M0 47.5 H250 M0 95 H250 M0 142.5 H250" fill="none"/></g><g transform="translate(540 125)" stroke="#16a34a" stroke-width="2"><rect x="-50" y="-38" width="250" height="190" fill="#dcfce7" stroke-dasharray="6 5"/><rect width="250" height="190" fill="#bbf7d0"/><path d="M50 0 V190 M100 0 V190 M150 0 V190 M200 0 V190 M0 47.5 H250 M0 95 H250 M0 142.5 H250" fill="none"/></g><text x="235" y="355" font-size="16" fill="#475569">No extra border is added;</text><text x="235" y="380" font-size="16" fill="#475569">output spatial size decreases.</text><text x="665" y="355" font-size="16" fill="#475569">Zero values are added around input;</text><text x="665" y="380" font-size="16" fill="#475569">output size is generally preserved.</text></g></svg>