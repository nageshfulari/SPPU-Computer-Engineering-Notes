<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370"><rect width="900" height="370" rx="18" fill="white"/><text x="28" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#172554">Functional Link ANN (FLANN) Architecture</text><g font-family="Arial" text-anchor="middle"><rect x="40" y="120" width="150" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="115" y="165" font-size="18" fill="#1e3a8a">Input</text><text x="115" y="190" font-size="18" fill="#1e3a8a">Signals</text><rect x="270" y="90" width="230" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="385" y="135" font-size="18" fill="#166534">Functional</text><text x="385" y="160" font-size="18" fill="#166534">Expansion</text><text x="385" y="195" font-size="16" fill="#166534">x, x², sin(x), cos(x)</text><rect x="580" y="120" width="145" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="652" y="165" font-size="18" fill="#92400e">Weighted</text><text x="652" y="190" font-size="18" fill="#92400e">Sum</text><rect x="780" y="120" width="90" height="100" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="825" y="178" font-size="18" fill="#9a3412">Output</text><path d="M190 170 H270 M500 170 H580 M725 170 H780" stroke="#475569" stroke-width="3"/></g><text x="450" y="300" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">FLANN expands input features directly and does not require a hidden layer.</text></svg>